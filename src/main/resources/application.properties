spring.application.name=job-tracker

# Database: PostgreSQL by default. The fallbacks match docker-compose.yml and are for local use only;
# set DB_URL / DB_USERNAME / DB_PASSWORD in any real environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USERNAME:jobtracker}
spring.datasource.password=${DB_PASSWORD:jobtracker}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info
