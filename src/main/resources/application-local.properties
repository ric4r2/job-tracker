# "local" profile: runs with an in-memory H2 database (PostgreSQL mode) and demo data,
# so you can try the API without installing PostgreSQL or Docker. Data is lost on restart.
spring.datasource.url=jdbc:h2:mem:jobtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.h2.console.enabled=true
